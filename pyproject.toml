[project]
name = "jobsearch-ai"
version = "0.1.0"
description = "An AI agent that finds jobs matching your preferences, writes tailored application documents, and applies after you approve."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "markdown-it-py>=3.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
jobsearch = "jobsearch.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobsearch*"]

[tool.setuptools.package-data]
"jobsearch.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() in defaults is the documented idiom.
# UP042: SQLModel maps `str, Enum` columns; StrEnum changes how they persist.
ignore = ["B008", "UP042"]
